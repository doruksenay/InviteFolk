# Ortamı hazırlar ve bilgilerini verir (diğer iş akışları kullanır; tek başına çalışmaz).
# Yalnızca iki API anahtarıyla her şeyi kendisi bulur ya da oluşturur:
#   - Supabase projesi (yoksa Frankfurt'ta açılır, hazır olana kadar beklenir)
#   - Supabase giriş ayarları (Gmail SMTP, 6 haneli kod e-postası, site adresi, iki adımlı doğrulama)
#   - Cloudflare Pages projesi ve adresi
# Tekrar çalıştırmak güvenlidir: var olan proje kullanılır, ayarlar aynı değerlerle yeniden yazılır.
name: Ortam

on:
  workflow_call:
    inputs:
      create:
        description: Proje yoksa oluştur ve ayarları yaz
        type: boolean
        default: true
    outputs:
      ref:
        value: ${{ jobs.ortam.outputs.ref }}
      publishable_key:
        value: ${{ jobs.ortam.outputs.publishable_key }}
      web_url:
        value: ${{ jobs.ortam.outputs.web_url }}
      cf_account:
        value: ${{ jobs.ortam.outputs.cf_account }}
      pages_project:
        value: ${{ jobs.ortam.outputs.pages_project }}

permissions:
  contents: read

jobs:
  ortam:
    name: Ortam
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      ref: ${{ steps.supa.outputs.ref }}
      publishable_key: ${{ steps.key.outputs.key }}
      web_url: ${{ steps.pages.outputs.web_url }}
      cf_account: ${{ steps.pages.outputs.account }}
      pages_project: ${{ steps.pages.outputs.project }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME || 'invitefolk' }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || format('invitefolk-{0}', github.repository_owner) }}
      API: https://api.supabase.com/v1
    steps:
      - name: Anahtarlar tamam mı?
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::GitHub → Settings → Secrets and variables → Actions → eksik secret:$missing (bkz. docs/canliya-alma.md)"
            exit 1
          fi

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Supabase projesi
        id: supa
        env:
          CREATE: ${{ inputs.create }}
          REF_OVERRIDE: ${{ vars.SUPABASE_PROJECT_REF }}
          ORG_OVERRIDE: ${{ vars.SUPABASE_ORG_ID }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json")
          # Hata olursa Supabase'in cevabını (anahtar içermez) özet sayfasına yazar.
          api() {
            local resp code
            resp=$(curl -sS -w '\n%{http_code}' -X "$1" "${auth[@]}" "$API$2") || { echo "::error::Supabase API'ye ulaşılamadı ($1 $2)" >&2; return 1; }
            code=${resp##*$'\n'}; resp=${resp%$'\n'*}
            if [ "$code" -ge 300 ]; then
              echo "::error::Supabase API $1 $2 → HTTP $code: $(printf '%s' "$resp" | tr -d '\r\n' | head -c 400)" >&2
              return 1
            fi
            printf '%s' "$resp"
          }
          find_ref() { api GET /projects | jq -r --arg n "$PROJECT_NAME" 'first(.[] | select(.name == $n) | (.ref // .id)) // empty'; }
          ref="${REF_OVERRIDE:-$(find_ref)}"
          if [ -z "$ref" ]; then
            if [ "$CREATE" != "true" ]; then echo "::error::Supabase projesi yok; önce 'Yayınla'yı çalıştırın."; exit 1; fi
            org="${ORG_OVERRIDE:-$(api GET /organizations | jq -r '(.[0].slug // .[0].id) // empty')}"
            [ -n "$org" ] || { echo "::error::Token Supabase organizasyonunu göremiyor. Organizasyon adresindeki kodu (supabase.com/dashboard/org/<kod>) GitHub Variables'a SUPABASE_ORG_ID olarak ekleyin ya da token'a 'Account and organization' yetkisi verin."; exit 1; }
            # Veritabanı şifresi bir kez üretilir ve hiçbir yerde saklanmaz: CLI geçici giriş rolüyle bağlanır.
            pw=$(openssl rand -hex 24); echo "::add-mask::$pw"
            echo "Proje oluşturuluyor: $PROJECT_NAME (eu-central-1, organizasyon: $org)"
            if ! out=$(supabase projects create "$PROJECT_NAME" --org-id "$org" --db-password "$pw" --region eu-central-1 2>&1); then
              echo "::error::Supabase projesi oluşturulamadı: $(printf '%s' "$out" | tr -d '\r' | tr '\n' ' ' | head -c 400)"
              exit 1
            fi
            ref=$(find_ref)
          fi
          [ -n "$ref" ] || { echo "::error::Supabase projesi bulunamadı."; exit 1; }
          # Hazır olana kadar bekle (yeni projede 1–3 dakika). Durdurulmuşsa uyandır.
          for _ in $(seq 1 60); do
            st=$(api GET "/projects/$ref" | jq -r '.status')
            echo "durum: $st"
            [ "$st" = "ACTIVE_HEALTHY" ] && break
            if [ "$st" = "INACTIVE" ] || [ "$st" = "PAUSED" ]; then
              api POST "/projects/$ref/restore" > /dev/null || true
            fi
            sleep 10
          done
          [ "$st" = "ACTIVE_HEALTHY" ] || { echo "::error::Supabase projesi hazır olmadı ($st)."; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Uygulama anahtarı (publishable)
        id: key
        env:
          REF: ${{ steps.supa.outputs.ref }}
        run: |
          set -euo pipefail
          key=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$API/projects/$REF/api-keys?reveal=false" \
            | jq -r 'first(.[] | select(.type == "publishable") | .api_key) // first(.[] | select(.name == "anon") | .api_key) // empty')
          [ -n "$key" ] || { echo "::error::Publishable key bulunamadı."; exit 1; }
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cloudflare Pages
        id: pages
        env:
          ACCOUNT_OVERRIDE: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEB_URL_OVERRIDE: ${{ vars.WEB_URL }}
        run: |
          set -euo pipefail
          cf=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          CF=https://api.cloudflare.com/client/v4
          acc=$(printf '%s' "$ACCOUNT_OVERRIDE" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-f0-9')
          if [ -z "$acc" ]; then
            res=$(curl -sS "${cf[@]}" "$CF/accounts")
            acc=$(printf '%s' "$res" | jq -r '.result[0].id // empty' 2>/dev/null || true)
            [ -n "$acc" ] || { echo "::error::Cloudflare hesabı bulunamadı. CLOUDFLARE_ACCOUNT_ID değişkenini (Variables) ekleyin. Cloudflare cevabı: $(printf '%s' "$res" | jq -c '.errors // .' 2>/dev/null | head -c 300)"; exit 1; }
          else
            echo "Cloudflare hesabı değişkenden alındı."
          fi
          v=$(curl -sS "${cf[@]}" "$CF/user/tokens/verify")
          echo "Token durumu: $(printf '%s' "$v" | jq -r '.result.status // "bilinmiyor"')"
          project=$(echo "$PAGES_PROJECT" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-\n' '-' | cut -c1-58)
          res=$(curl -sS "${cf[@]}" "$CF/accounts/$acc/pages/projects/$project")
          if [ "$(echo "$res" | jq -r '.success')" != "true" ]; then
            echo "Pages projesi oluşturuluyor: $project"
            res=$(curl -sS -X POST "${cf[@]}" "$CF/accounts/$acc/pages/projects" \
              -d "$(jq -n --arg n "$project" '{name: $n, production_branch: "main"}')")
          fi
          sub=$(echo "$res" | jq -r '.result.subdomain // empty')
          [ -n "$sub" ] || { echo "::error::Pages adresi alınamadı: $(echo "$res" | jq -c '.errors')"; exit 1; }
          {
            echo "account=$acc"
            echo "project=$project"
            echo "web_url=${WEB_URL_OVERRIDE:-https://$sub}"
          } >> "$GITHUB_OUTPUT"

      - name: Giriş ayarları (e-posta kodu, SMTP, iki adımlı doğrulama)
        if: inputs.create
        env:
          REF: ${{ steps.supa.outputs.ref }}
          WEB_URL: ${{ steps.pages.outputs.web_url }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          # Gmail dışı servislerde (ör. Brevo) giriş adı gönderen adresi değildir; gönderen ayrıca verilir.
          SMTP_FROM: ${{ vars.SMTP_FROM }}
        run: |
          set -euo pipefail
          read -r -d '' BODY_TR <<'HTML' || true
          <h2 style="font-family:Helvetica,Arial,sans-serif;color:#1F1B2E">Invitefolk giriş kodun</h2>
          <p style="font-family:Helvetica,Arial,sans-serif;color:#3A3548">Uygulamaya şu kodu yaz / Enter this code in the app:</p>
          <p style="font-family:Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;letter-spacing:8px;color:#6C5CE7">{{ .Token }}</p>
          <p style="font-family:Helvetica,Arial,sans-serif;color:#6E6A72;font-size:13px">Bu kodu sen istemediysen e-postayı yok sayabilirsin. / If you didn't ask for this code, ignore this email.</p>
          HTML
          cfg=$(jq -n --arg site "$WEB_URL" --arg body "$BODY_TR" '{
            site_url: $site,
            uri_allow_list: ($site + "/**,invitefolk://**"),
            external_email_enabled: true,
            mailer_autoconfirm: false,
            mailer_otp_length: 6,
            mailer_otp_exp: 900,
            mailer_subjects_magic_link: "Invitefolk giriş kodun: {{ .Token }}",
            mailer_templates_magic_link_content: $body,
            mailer_subjects_confirmation: "Invitefolk giriş kodun: {{ .Token }}",
            mailer_templates_confirmation_content: $body,
            mfa_totp_enroll_enabled: true,
            mfa_totp_verify_enabled: true
          }')
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ]; then
            cfg=$(echo "$cfg" | jq --arg u "$SMTP_USER" --arg f "${SMTP_FROM:-$SMTP_USER}" --arg p "$SMTP_PASSWORD" --arg h "$SMTP_HOST" --arg port "$SMTP_PORT" \
              '. + {smtp_admin_email: $f, smtp_user: $u, smtp_pass: $p, smtp_host: $h, smtp_port: $port, smtp_sender_name: "Invitefolk", smtp_max_frequency: 30, rate_limit_email_sent: 30}')
          else
            echo "::warning::SMTP_USER/SMTP_PASSWORD yok: giriş kodu e-postaları yalnızca Supabase ekibindeki adreslere ve saatte 2 tane gider."
          fi
          resp=$(curl -sS -w '\n%{http_code}' -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            "$API/projects/$REF/config/auth" -d "$cfg")
          code=${resp##*$'\n'}
          if [ "$code" -ge 300 ]; then
            echo "::error::Giriş ayarları yazılamadı (HTTP $code): $(printf '%s' "${resp%$'\n'*}" | tr -d '\r\n' | head -c 400)"
            exit 1
          fi
          echo "Giriş ayarları yazıldı."

      - name: Özet
        env:
          REF: ${{ steps.supa.outputs.ref }}
          WEB_URL: ${{ steps.pages.outputs.web_url }}
        run: |
          {
            echo "### Ortam"
            echo "- Supabase: \`$REF\` (https://supabase.com/dashboard/project/$REF)"
            echo "- Web: $WEB_URL"
          } >> "$GITHUB_STEP_SUMMARY"
