# main'e her push'ta (ya da Actions sekmesinden elle): kontrol → Supabase (veritabanı + fonksiyonlar + sırlar) → web (Cloudflare Pages).
# Tamamen ücretsiz katmanlarla çalışır. Kurulum ve gereken sırlar: docs/canliya-alma.md
name: Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Aynı anda tek yayın; yenisi gelirse sıradaki beklenir (yarım kalan yayın olmaz).
concurrency:
  group: yayin
  cancel-in-progress: false

jobs:
  kontrol:
    uses: ./.github/workflows/ci.yml

  supabase:
    name: Supabase
    needs: kontrol
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6

      - name: Ayarlar tamam mı?
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN(secret)"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD(secret)"
          [ -n "$SUPABASE_PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Eksik GitHub ayarı:$missing — bkz. docs/canliya-alma.md"
            exit 1
          fi

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Projeye bağlan
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Veritabanı (migration'lar)
        run: supabase db push --yes

      - name: Sunucu sırları
        # Yalnızca dolu olanlar yazılır; boş bırakılan özellik (SMS, yapay zekâ, otomatik WhatsApp…) kapalı kalır.
        env:
          WEB_URL: ${{ vars.WEB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NETGSM_USERCODE: ${{ secrets.NETGSM_USERCODE }}
          NETGSM_PASSWORD: ${{ secrets.NETGSM_PASSWORD }}
          NETGSM_HEADER: ${{ vars.NETGSM_HEADER }}
          IYZICO_API_KEY: ${{ secrets.IYZICO_API_KEY }}
          IYZICO_SECRET_KEY: ${{ secrets.IYZICO_SECRET_KEY }}
          IYZICO_BASE_URL: ${{ vars.IYZICO_BASE_URL }}
        run: |
          set -e
          umask 077
          f=$(mktemp)
          put() { if [ -n "$2" ]; then printf '%s=%s\n' "$1" "$2" >> "$f"; fi; }
          put APP_WEB_URL "$WEB_URL"
          put ALLOWED_ORIGINS "$WEB_URL"
          for k in CRON_SECRET RESEND_API_KEY EMAIL_FROM WHATSAPP_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_APP_SECRET \
                   WHATSAPP_VERIFY_TOKEN ANTHROPIC_API_KEY NETGSM_USERCODE NETGSM_PASSWORD NETGSM_HEADER \
                   IYZICO_API_KEY IYZICO_SECRET_KEY IYZICO_BASE_URL; do
            put "$k" "${!k}"
          done
          if [ -s "$f" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$f"
          fi
          rm -f "$f"

      - name: Sunucu fonksiyonları
        # JWT ayarları supabase/config.toml'dan okunur (webhook ve davetli fonksiyonları girişsiz çalışır).
        run: supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_REF"

  web:
    name: Web (Cloudflare Pages)
    needs: supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'invitefolk' }}
      EXPO_PUBLIC_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v6

      - name: Ayarlar tamam mı?
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID(variable)"
          [ -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing SUPABASE_PUBLISHABLE_KEY(variable)"
          [ -n "$EXPO_PUBLIC_WEB_URL" ] || missing="$missing WEB_URL(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Eksik GitHub ayarı:$missing — bkz. docs/canliya-alma.md"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Web derlemesi (+ güvenlik başlıkları)
        run: npm run build:web

      - name: Cloudflare Pages projesi (yoksa oluştur)
        run: npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch main || true

      - name: Yayınla
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true

      - name: Adres
        run: echo "### Yayında → $EXPO_PUBLIC_WEB_URL" >> "$GITHUB_STEP_SUMMARY"
