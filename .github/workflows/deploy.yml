# main'e her push'ta (ya da Actions sekmesinden elle):
#   kontrol → ortam (Supabase projesi + giriş ayarları + Cloudflare Pages; yoksa oluşturur)
#           → Supabase (migration'lar, sırlar, fonksiyonlar, zamanlayıcı, yönetici) → web (Cloudflare Pages)
# Tamamen ücretsiz katmanlarla çalışır. Gereken tek şey dört secret: docs/canliya-alma.md
name: Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Aynı anda tek yayın; yenisi gelirse sıradaki beklenir (yarım kalan yayın olmaz).
concurrency:
  group: yayin
  cancel-in-progress: false

jobs:
  kontrol:
    uses: ./.github/workflows/ci.yml

  ortam:
    needs: kontrol
    uses: ./.github/workflows/ortam.yml
    secrets: inherit
    with:
      create: true

  supabase:
    name: Supabase
    needs: ortam
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Boşsa CLI kendi geçici giriş rolüyle bağlanır (veritabanı şifresi gerekmez).
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ needs.ortam.outputs.ref }}
      WEB_URL: ${{ needs.ortam.outputs.web_url }}
      API: https://api.supabase.com/v1
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Projeye bağlan
        run: supabase link --project-ref "$REF"

      - name: Veritabanı (migration'lar)
        run: supabase db push --yes

      - name: Sunucu sırları
        # Yalnızca dolu olanlar yazılır; boş bırakılan özellik (SMS, yapay zekâ, otomatik WhatsApp…) kapalı kalır.
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NETGSM_USERCODE: ${{ secrets.NETGSM_USERCODE }}
          NETGSM_PASSWORD: ${{ secrets.NETGSM_PASSWORD }}
          NETGSM_HEADER: ${{ vars.NETGSM_HEADER }}
          IYZICO_API_KEY: ${{ secrets.IYZICO_API_KEY }}
          IYZICO_SECRET_KEY: ${{ secrets.IYZICO_SECRET_KEY }}
          IYZICO_BASE_URL: ${{ vars.IYZICO_BASE_URL }}
        run: |
          set -e
          umask 077
          f=$(mktemp)
          put() { if [ -n "$2" ]; then printf '%s=%s\n' "$1" "$2" >> "$f"; fi; }
          put APP_WEB_URL "$WEB_URL"
          put ALLOWED_ORIGINS "$WEB_URL"
          for k in RESEND_API_KEY EMAIL_FROM WHATSAPP_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_APP_SECRET \
                   WHATSAPP_VERIFY_TOKEN ANTHROPIC_API_KEY NETGSM_USERCODE NETGSM_PASSWORD NETGSM_HEADER \
                   IYZICO_API_KEY IYZICO_SECRET_KEY IYZICO_BASE_URL; do
            put "$k" "${!k}"
          done
          supabase secrets set --project-ref "$REF" --env-file "$f"
          rm -f "$f"

      - name: Sunucu fonksiyonları
        # JWT ayarları supabase/config.toml'dan okunur (webhook ve davetli fonksiyonları girişsiz çalışır).
        run: supabase functions deploy --use-api --project-ref "$REF"

      - name: Zamanlayıcı (10 dakikada bir; yoksa kurulur)
        run: |
          set -euo pipefail
          q() { curl -fsS -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
                  "$API/projects/$REF/database/query" -d "$(jq -n --arg s "$1" '{query: $s}')"; }
          has_job=$(q "select count(*)::int as n from pg_extension where extname = 'pg_cron'" | jq -r '.[0].n')
          if [ "$has_job" = "1" ]; then
            has_job=$(q "select count(*)::int as n from cron.job where jobname = 'davet-scheduled'" | jq -r '.[0].n')
          else
            has_job=0
          fi
          has_secret=$(supabase secrets list --project-ref "$REF" -o json | jq -r '[.[] | select(.name == "CRON_SECRET")] | length')
          if [ "$has_job" = "1" ] && [ "$has_secret" = "1" ]; then
            echo "Zamanlayıcı zaten kurulu."
            exit 0
          fi
          # Gizli değer burada üretilir; yalnızca fonksiyonun sırrına ve veritabanı kasasına (Vault) yazılır.
          secret=$(openssl rand -hex 32); echo "::add-mask::$secret"
          umask 077; f=$(mktemp); printf 'CRON_SECRET=%s\n' "$secret" > "$f"
          supabase secrets set --project-ref "$REF" --env-file "$f"; rm -f "$f"
          sql=$(sed -e "s|<CRON_SECRET>|$secret|" -e "s|<PROJE_REF>|$REF|" scripts/zamanlayici.sql)
          q "$sql" > /dev/null
          echo "Zamanlayıcı kuruldu."

      - name: Yönetici (ADMIN_EMAIL ya da SMTP_USER, ilk girişten sonra)
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || secrets.SMTP_USER }}
        run: |
          set -euo pipefail
          [ -n "$ADMIN_EMAIL" ] || { echo "Yönetici e-postası tanımlı değil, atlandı."; exit 0; }
          email=$(printf '%s' "$ADMIN_EMAIL" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9@._+-')
          sql="update public.profiles set role = 'admin' where role <> 'admin' and id = (select id from auth.users where lower(email) = '$email') returning id"
          n=$(curl -fsS -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
                "$API/projects/$REF/database/query" -d "$(jq -n --arg s "$sql" '{query: $s}')" | jq 'length')
          if [ "$n" = "1" ]; then echo "Yönetici yetkisi verildi."; else echo "Değişiklik yok (henüz giriş yapılmadı ya da zaten yönetici)."; fi

  web:
    name: Web (Cloudflare Pages)
    needs: [ortam, supabase]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Hesap kimliği secret olarak girildiyse GitHub onu iş çıktısı olarak aktarmaz; doğrudan okunur.
      CLOUDFLARE_ACCOUNT_ID: ${{ needs.ortam.outputs.cf_account || vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ needs.ortam.outputs.pages_project }}
      EXPO_PUBLIC_SUPABASE_URL: https://${{ needs.ortam.outputs.ref }}.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ needs.ortam.outputs.publishable_key }}
      EXPO_PUBLIC_WEB_URL: ${{ needs.ortam.outputs.web_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Web derlemesi (+ güvenlik başlıkları)
        run: npm run build:web

      - name: Yayınla
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true

      - name: Adres
        run: echo "### Yayında → $EXPO_PUBLIC_WEB_URL" >> "$GITHUB_STEP_SUMMARY"
