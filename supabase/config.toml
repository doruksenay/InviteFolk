# Supabase CLI yapılandırması (yerel geliştirme için).
# project_id: supabase link --project-ref <ref> ile bağlandığında kullanılır.
project_id = "invitefolk"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = ["davet://"]

[auth.email]
enable_signup = true
# Uygulama, e-postaya gelen 6 haneli kodla giriş yapar (derin bağlantı gerektirmez).
otp_length = 6

[functions.whatsapp-webhook]
verify_jwt = false

# Davetli sayfası tasarım görselini ister (girişsiz; davet anahtarı fonksiyon içinde doğrulanır)
[functions.invitation-design]
verify_jwt = false

# Web ödemesi başlatma (giriş yapmış kullanıcı)
[functions.iyzico-checkout]
verify_jwt = true

# iyzico'nun dönüşü (tarayıcı yönlendirmesi; ödeme sonucu sunucudan iyzico'ya sorulur)
[functions.iyzico-callback]
verify_jwt = false

# RevenueCat sunucu bildirimi (Authorization başlığındaki gizli anahtarla doğrulanır)
[functions.revenuecat-webhook]
verify_jwt = false

# Zamanlanmış işler (CRON_SECRET başlığıyla doğrulanır)
[functions.scheduled]
verify_jwt = false

# E-posta daveti (giriş yapmış kullanıcı)
[functions.send-email]
verify_jwt = true

# SMS ile davet (giriş yapmış kullanıcı)
[functions.send-sms]
verify_jwt = true

# Ortak yönetici daveti (giriş yapmış kullanıcı)
[functions.cohost-invite]
verify_jwt = true

# Davetli sayfası: hava durumu (girişsiz; davet anahtarı fonksiyon içinde doğrulanır)
[functions.weather]
verify_jwt = false

# Takvim aboneliği (.ics; takvim uygulamaları başlık gönderemez, davet anahtarı doğrulanır)
[functions.calendar]
verify_jwt = false

# Davetlilerin fotoğraf albümü (girişsiz; herkese açık etkinlik bağlantısı doğrulanır)
[functions.album-upload]
verify_jwt = false
